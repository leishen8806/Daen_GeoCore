name: CI
on:
  push:
    branches: ["impl/software-baseline"]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: daen
          POSTGRES_PASSWORD: daen_ci
          POSTGRES_DB: daen_geocore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daen -d daen_geocore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run pytest tests/integration/postgres
        env:
          DAEN_TEST_DATABASE_URL: postgresql+psycopg://daen:daen_ci@localhost:5432/daen_geocore
