[project]
name = "daen-geocore"
version = "0.1.0"
description = "DAEN Geo Core implementation baseline"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "hypothesis>=6.115,<7",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daen_geocore"]

[tool.ruff]
line-length = 100
exclude = ["validation/m1"]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src/daen_geocore"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
default-groups = ["dev"]

